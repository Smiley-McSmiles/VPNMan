name: Release

# Push a tag such as v1.0.6 (after bumping the version everywhere) and this builds every package and attaches
# them to a GitHub release, with the notes taken from data/*.metainfo.xml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in the code
        run: python3 tools/check_version.py "${GITHUB_REF_NAME}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 rpm xz-utils

      - name: Build packages
        run: ./package.sh

      - name: Release notes
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # every package package.sh built for this version (whatever this runner could build) and its SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          mapfile -t files < <(find dist -maxdepth 1 -type f \( -name "*${version}*" -o -name SHA256SUMS \) | sort)
          test -s dist/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --title "VPNMan ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
