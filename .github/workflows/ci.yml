name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            xvfb xdotool dbus x11-utils imagemagick \
            openvpn stunnel4 nftables iproute2 rpm zsh fish

      - name: Shell syntax
        run: |
          sh -n install.sh
          bash -n package.sh

      - name: Version is the same everywhere
        run: python3 tools/check_version.py

      - name: Shell completions are up to date
        run: python3 tools/gen_completions.py --check

      # Run as root like the daemon does: the installer, service and daemon tests need it. The tests never touch the
      # runner's real firewall (they stub it), and every GUI test runs under Xvfb.
      - name: Tests
        run: sudo -E env "PATH=$PATH" python3 -m unittest tests.test_vpnman -v

      - name: Build every package
        run: ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.xz
            dist/recipes
          if-no-files-found: error
